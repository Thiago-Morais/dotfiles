[config]
version_check = true
fallback_color = "black"
prefer = "saturation"
caching = true

# [config.wallpaper]
# set = true
# command = "hyprctl"
# arguments = ["hyprpaper", "reload", ","]

[config.custom_colors]
"black" = "#000000"
"silver" = "#c0c0c0"
"gray" = "#808080"
"white" = "#ffffff"

"red" = "#ff0000"
"fuchsia" = "#ff00ff"
"blue" = "#0000ff"
"aqua" = "#00ffff"
"lime" = "#00ff00"
"yellow" = "#ffff00"

"brown" = "#800000"
"navy" = "#000080"
"green" = "#008000"

"deeppink" = "#ff0080"
"purple" = "#800080"
"blueviolet" = "#8000ff"
"dodgerblue" = "#0080ff"
"teal" = "#008080"
"springgreen" = "#00ff80"
"chartreuse" = "#80ff00"
"olive" = "#808000"
"orange" = "#ff8000"

"lightcoral" = "#ff8080"
"violet" = "#ff80ff"
"mediumslateblue" = "#8080ff"
"turquoise" = "#80ffff"
"palegreen" = "#80ff80"
"khaki" = "#ffff80"

# Red to Lime gradient
"red_to_lime_0"  = "#ff0000"
"red_to_lime_1"  = "#fc4300"
"red_to_lime_2"  = "#f66300"
"red_to_lime_3"  = "#ea7e00"
"red_to_lime_4"  = "#dd9500"
"red_to_lime_5"  = "#ceaa00"
"red_to_lime_6"  = "#bdbc00"
"red_to_lime_7"  = "#a9ce00"
"red_to_lime_8"  = "#8fdf00"
"red_to_lime_9"  = "#65f000"
"red_to_lime_10" = "#00ff00"

# Find more themes at https://github.com/InioX/matugen-themes

[templates.btop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'
post_hook = 'pkill -USR2 btop || true'

[templates.copy_colors]
input_path = '~/.config/matugen/templates/copy_colors'
output_path = '~/.config/matugen/cached_colors'

[templates.hyprland-lua]
input_path = '~/.config/matugen/templates/hyprland-colors.lua'
output_path = '~/.config/hypr/colors.lua'
post_hook = 'hyprctl reload'

[templates.waybar-extra]
input_path = '~/.config/matugen/templates/waybar-extra-colors.css'
output_path = '~/.config/waybar/themes/extra-colors.css'

[templates.waybar]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/waybar/themes/colors.css'

[templates.rofi]
input_path = '~/.config/matugen/templates/rofi-colors.rasi'
output_path = '~/.config/rofi/colors.rasi'

[templates.wofi]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/wofi/colors.css'

[templates.gtk3]
input_path = '~/.config/matugen/templates/matugen-gtk.css'
output_path = '~/.config/gtk-3.0/gtk.css'
post_hook = '''gsettings set org.gnome.desktop.interface gtk-theme ""; 
if [ '{{mode}}' = 'dark' ];
gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3-dark;
else;
gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3;
end
'''

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-colors.css'
# input_path = '~/.config/matugen/templates/matugen-gtk.css'
output_path = '~/.config/gtk-4.0/colors.css'
# output_path = '~/.config/gtk-4.0/gtk.css'

# [templates.pywalfox]
# input_path = '~/.config/matugen/templates/pywalfox-colors.json'
# output_path = '~/.cache/wal/colors.json'
# post_hook = 'pywalfox update'

[templates.wlogout]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/wlogout/colors.css'

[templates.wleave]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/wleave/colors.css'

[templates.alacritty]
input_path = '~/.config/matugen/templates/alacritty.toml'
output_path = '~/.config/alacritty/colors.toml'

[templates.yazi]
input_path = '~/.config/matugen/templates/yazi-theme.toml'
output_path = '~/.config/yazi/theme.toml'

[templates.neovim]
input_path = '~/.config/matugen/templates/neovim.lua'
output_path = '~/.config/nvim/matugen.lua'
post_hook = 'pkill -SIGUSR1 nvim'

[templates.pear_desktop]
input_path = '~/.config/matugen/templates/pear-desktop.css'
output_path = '~/.config/YouTube Music/themes/colors.css'

[templates.mako]
input_path = '~/.config/matugen/templates/mako'
output_path = '~/.config/mako/mako-colors'
post_hook = 'makoctl reload'

[templates.xsettingsd]
input_path = '~/.config/matugen/templates/xsettingsd.conf'
output_path = '~/.config/xsettingsd/xsettingsd.conf'
post_hook = 'pkill -HUP -x xsettingsd'
